# 本机基础服务编排：使用独立的 Milvus 宿主机端口，避免与其他项目冲突。
# 从仓库根目录运行：docker compose -f docker-compose.local.yml up -d postgres etcd minio milvus
# 本机专用编排：基于 docker-compose.yml，仅调整与其他项目冲突的宿主机端口。
# Milvus 宿主机端口 19530/9091 已被 medical-health-assistant-milvus-1 占用，
# 这里改用 19540/9095；容器内部端口不变。postgres/minio 端口当前空闲，保持原样。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devflow-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devflow}
      POSTGRES_DB: ${POSTGRES_DB:-devflow}
    ports:
      - "5432:5432"
    volumes:
      - devflow_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devflow} -d ${POSTGRES_DB:-devflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: devflow-ai-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - devflow_etcd_data:/etcd

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: devflow-ai-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: silo server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - devflow_minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: devflow-ai-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19540:19530"
      - "9095:9091"
    depends_on:
      - etcd
      - minio

volumes:
  devflow_postgres_data:
  devflow_etcd_data:
  devflow_minio_data:
